<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0ea5e9" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Icon Mark -->
  <g filter="url(#glow)">
    <!-- Back Building -->
    <rect x="16" y="24" width="22" height="42" rx="4" fill="#0f172a" />
    <rect x="22" y="30" width="4" height="6" rx="1" fill="#38bdf8" fill-opacity="0.7"/>
    <rect x="22" y="40" width="4" height="6" rx="1" fill="#38bdf8" fill-opacity="0.7"/>
    <rect x="22" y="50" width="4" height="6" rx="1" fill="#38bdf8" fill-opacity="0.7"/>

    <!-- Main Tower -->
    <path d="M42 12L64 26V66H42V12Z" fill="url(#primaryGrad)"/>
    <path d="M64 26L78 35V66H64V26Z" fill="#0369a1"/>
    
    <!-- Stylized Roof Accent -->
    <path d="M40 13L64 27L42 29L40 13Z" fill="url(#goldGrad)"/>
    
    <!-- Windows -->
    <rect x="48" y="32" width="6" height="7" rx="1.5" fill="#ffffff" fill-opacity="0.9"/>
    <rect x="48" y="44" width="6" height="7" rx="1.5" fill="#ffffff" fill-opacity="0.9"/>
    <rect x="48" y="55" width="6" height="7" rx="1.5" fill="#ffffff" fill-opacity="0.9"/>
    
    <!-- Smart Node / AI spark -->
    <circle cx="64" cy="20" r="4" fill="#f59e0b"/>
    <circle cx="64" cy="20" r="7" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="2 2"/>
  </g>

  <!-- Typography -->
  <g>
    <text x="96" y="45" font-family="'Cairo', 'Inter', system-ui, sans-serif" font-size="30" font-weight="900" fill="#0f172a" letter-spacing="-0.5">
      Eng<tspan fill="#0284c7">Prop</tspan>
    </text>
    <text x="98" y="62" font-family="'Cairo', system-ui, sans-serif" font-size="12" font-weight="700" fill="#64748b" letter-spacing="0.5">
      منصة العقارات والمكاتب الذكية
    </text>
  </g>
</svg>
